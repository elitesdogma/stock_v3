[project]
name = "stock-v3"
version = "0.1.0"
description = "Institutional-grade equity research CLI: live free-data ingestion, deterministic scoring, self-contained HTML reports."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "jc" }]
dependencies = [
    "yfinance>=0.2.50",
    "finnhub-python>=2.4.0",
    "fredapi>=0.5.2",
    "edgartools>=3.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "jinja2>=3.1.4",
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
]

[project.optional-dependencies]
narrative = ["anthropic>=0.40.0"]

[project.scripts]
analyze = "stock_v3.cli:main"
serve = "stock_v3.server:main"

[dependency-groups]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
